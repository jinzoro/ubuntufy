# Ubuntuify Fedora - shipped defaults.
#
# Do not edit this file: copy any key you want to change into
# ~/.config/ubuntuify/config.conf. Run `ubuntuify config` to see the
# effective values and `ubuntuify config --sample` for a template.

profile=full
color_scheme=default

# Theme
theme.install=true
theme.name=Yaru
theme.dark_name=Yaru-dark
theme.shell_name=Yaru
theme.shell_dark_name=Yaru-dark

# Icons
icons.install=true
icons.name=Yaru
icons.dark_name=Yaru-dark

# Cursor
cursor.install=true
cursor.name=Yaru
cursor.size=24

# Fonts
fonts.install=true
fonts.family=Ubuntu
fonts.monospace_family=Ubuntu Mono
fonts.size=11
fonts.monospace_size=13
fonts.titlebar_size=11

# Appearance
appearance.accent=orange
appearance.hot_corner=true
appearance.clock_24h=false

# Dock
dock.enabled=true
dock.position=left
dock.icon_size=48
dock.extend_height=true
dock.fixed=true
dock.autohide=false
dock.intellihide=false
dock.show_favorites=true
dock.show_running=true
dock.show_trash=true
dock.show_mounts=true
dock.show_apps_button=true
dock.apps_button_at_top=true
dock.click_action=minimize-or-previews
dock.scroll_action=cycle-windows
dock.multi_monitor=false
dock.opacity=0.8
dock.theme_shrink=true

# Desktop icons
desktop_icons.enabled=true
desktop_icons.home=true
desktop_icons.trash=true
desktop_icons.volumes=true
desktop_icons.network_volumes=true
desktop_icons.icon_size=standard
desktop_icons.start_corner=top-left
desktop_icons.show_drop_placeholder=true

# System tray
tray.enabled=true
tray.icon_size=16
tray.icon_padding=0

# Tiling
tiling.enabled=true

# Top panel
panel.show_date=true
panel.show_weekday=true
panel.show_seconds=false
panel.show_battery_percentage=true
panel.clock_format=

# Window behaviour
windows.buttons=appmenu:minimize,maximize,close
windows.animations=true
windows.focus_mode=click
windows.raise_on_click=true
windows.auto_raise=false
windows.edge_tiling=true

# Workspaces
workspaces.dynamic=true
workspaces.only_primary=true

# Notifications
notifications.show_in_lock_screen=true

# Power (GNOME-level only; Fedora power management is left intact)
power.button_action=interactive

# Shortcuts
ubuntu_shortcuts=true
shortcuts.on_conflict=ask
shortcuts.terminal=true
shortcuts.home=true
shortcuts.show_apps=true
shortcuts.lock=true
shortcuts.tiling=true

# Applications
nautilus.enabled=true
favorites.enabled=true
favorites.merge=true
favorites.list=firefox.desktop|firefox_firefox.desktop|org.mozilla.firefox.desktop;org.gnome.Nautilus.desktop;org.gnome.Console.desktop|org.gnome.Terminal.desktop;org.gnome.Software.desktop|snap-store_snap-store.desktop;org.gnome.Settings.desktop

# Default applications
defaults.enabled=true

# Wallpaper: ask | ubuntu-default | keep | /absolute/path.png
wallpaper.mode=ask
# wallpaper.path=/home/user/Pictures/wallpaper.png
wallpaper.width=2560
wallpaper.height=1440

# Sound
sound.enabled=true
sound.theme=Yaru

# Boot branding is opt-in and never applied by a profile.
plymouth=false
gdm=false

# Extension installation: ask | yes | no. "yes" allows the official
# extensions.gnome.org fallback when Fedora does not package an extension.
online_extensions=ask

# Backups
backup.keep=10
